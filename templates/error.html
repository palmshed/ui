<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error</title>
  <meta name="description" content="Palmshed error page.">
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/mark.svg">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav>
    <span class="nav-mark">palmshed</span>
    <ul class="nav-links" id="nav">
      <li><a href="/templates/home.html">Home</a></li>
      <li><a href="/templates/projects.html">Projects</a></li>
      <li><a href="/templates/docs.html">Docs</a></li>
      <li><a href="/templates/about.html">About</a></li>
    </ul>
    <button type="button" class="mobile-menu-toggle" aria-label="Menu" aria-expanded="false">Menu</button>
  </nav>

  <div class="hero">
    <div class="hero-content">
      <h1>Error</h1>
      <p>Something went wrong. Return to the <a href="/templates/home.html">homepage</a>.</p>
    </div>
  </div>

  <div class="page">
    <section>
      <h2>Status</h2>
      <p class="error-code">404</p>
      <p>The page you are looking for does not exist.</p>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 Palmshed</p>
    <ul class="footer-links">
      <li><a href="https://github.com/palmshed">GitHub</a></li>
    </ul>
  </footer>

  <script>
    (function() {
      var toggle = document.querySelector('.mobile-menu-toggle');
      var nav = document.getElementById('nav');
      if (!toggle || !nav) return;
      function sync() { toggle.setAttribute('aria-expanded', nav.classList.contains('active')); }
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        nav.classList.toggle('active');
        sync();
      });
      document.addEventListener('click', function(e) {
        if (nav.classList.contains('active') && !nav.contains(e.target) && e.target !== toggle) {
          nav.classList.remove('active');
          sync();
        }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && nav.classList.contains('active')) {
          nav.classList.remove('active');
          sync();
          toggle.focus();
        }
      });
    })();
  </script>
</body>
</html>
