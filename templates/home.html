<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <meta name="description" content="Palmshed organization homepage.">
  <link rel="icon" href="/ui/assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/ui/assets/mark.svg">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/base.css">
  <link rel="stylesheet" href="/ui/layout.css">
  <link rel="stylesheet" href="/ui/components.css">
</head>
<body>
  <nav>
    <span class="nav-mark">palmshed</span>
    <ul class="nav-links" id="nav">
      <li><a href="/templates/home.html" class="active">Home</a></li>
      <li><a href="/templates/projects.html">Projects</a></li>
      <li><a href="/templates/docs.html">Docs</a></li>
      <li><a href="/templates/about.html">About</a></li>
    </ul>
    <button type="button" class="mobile-menu-toggle" aria-label="Menu" aria-expanded="false">Menu</button>
  </nav>

  <div class="hero">
    <div class="hero-content">
      <h1>Palmshed</h1>
      <p>Engineering organization building reusable platforms for Palmshed projects.</p>
    </div>
  </div>

  <div class="page">
    <section>
      <h2>Projects</h2>
      <ul>
        <li><a href="/auth">palmshed/auth</a> - authentication platform</li>
        <li><a href="/ui">palmshed/ui</a> - shared design system</li>
      </ul>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 Palmshed</p>
    <ul class="footer-links">
      <li><a href="https://github.com/palmshed">GitHub</a></li>
    </ul>
  </footer>

  <script>
    (function() {
      var toggle = document.querySelector('.mobile-menu-toggle');
      var nav = document.getElementById('nav');
      if (!toggle || !nav) return;
      function sync() { toggle.setAttribute('aria-expanded', nav.classList.contains('active')); }
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        nav.classList.toggle('active');
        sync();
      });
      document.addEventListener('click', function(e) {
        if (nav.classList.contains('active') && !nav.contains(e.target) && e.target !== toggle) {
          nav.classList.remove('active');
          sync();
        }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && nav.classList.contains('active')) {
          nav.classList.remove('active');
          sync();
          toggle.focus();
        }
      });
    })();
  </script>
</body>
</html>
