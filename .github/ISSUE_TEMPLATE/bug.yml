name: Bug report
description: Report a problem with palmshed/ui
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected page or component

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce

  - type: textarea
    id: environment
    attributes:
      label: Browser and OS
