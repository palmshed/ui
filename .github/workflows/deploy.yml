name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/docs

          cp -r docs/* site/docs/
          cp -r css site/
          cp -r assets site/
          cp -r examples site/
          cp -r templates site/

          cat > site/index.html << 'REDIRECT'
<!DOCTYPE html>
<meta charset="utf-8">
<title>palmshed/ui</title>
<meta http-equiv="refresh" content="0; url=docs/">
<script>location.replace("docs/");</script>
REDIRECT

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
