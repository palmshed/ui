name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML validation
        run: |
          npm install -g html-validate 2>/dev/null
          for f in templates/*.html docs/*.html examples/basic.html; do
            npx --yes html-validate --max-warnings 0 "$f"
          done

      - name: CSS syntax check
        run: |
          for f in css/*.css; do
            opens=$(grep -c '{' "$f" || true)
            closes=$(grep -c '}' "$f" || true)
            if [ "$opens" != "$closes" ]; then
              echo "FAIL: ${opens} opens / ${closes} closes in $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check asset references
        run: |
          for f in templates/*.html docs/*.html; do
            for ref in $(grep -oE '(href|src)="[^"]+"' "$f" | sed 's/^[^"]*"//;s/"$//'); do
              case "$ref" in
                http*|'#'*|'') continue ;;
                /*.css|/*.svg|/*.html|/*.md) target=".${ref}" ;;
                ../*.css|../*.svg|../*.html|../*.md) target="${ref#../}" ;;
                *) continue ;;
              esac
              if [ ! -f "$target" ]; then
                echo "MISSING: $ref in $f"
                exit 1
              fi
            done
          done

      - name: Check template structure
        run: |
          for f in templates/*.html; do
            grep -q '<!DOCTYPE html>' "$f" || { echo "Missing DOCTYPE in $f"; exit 1; }
            grep -q '<nav>' "$f" || { echo "Missing <nav> in $f"; exit 1; }
            grep -q '<footer>' "$f" || { echo "Missing <footer> in $f"; exit 1; }
          done

      - name: Verify internal links
        run: |
          for f in templates/*.html docs/*.html; do
            dir=$(dirname "$f")
            for link in $(grep -oE 'href="[^"]*\.html"' "$f" | sed 's/^[^"]*"//;s/"$//'); do
              case "$link" in
                http*|'#'*) continue ;;
                /*.html) target=".${link}" ;;
                ../*.html) target="${link#../}" ;;
                *.html) target="$dir/$link" ;;
                *) continue ;;
              esac
              if [ ! -f "$target" ]; then
                echo "BROKEN LINK: $link in $f"
                exit 1
              fi
            done
          done
