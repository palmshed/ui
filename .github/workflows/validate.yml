name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML validation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tidy 2>/dev/null
          for f in templates/*.html docs/*.html examples/basic.html; do
            if ! tidy -q -e "$f" 2>/dev/null; then
              tidy -e "$f" 2>&1 | grep -v '^$' || true
            fi
          done

      - name: CSS syntax check
        run: |
          pip install tinycss2 -q 2>/dev/null || true
          for f in css/*.css; do
            if command -v python3 &>/dev/null; then
              python3 -c "
import re
with open('$f') as fh:
    content = fh.read()
open_parens = content.count('{')
close_parens = content.count('}')
if open_parens != close_parens:
    print(f'FAIL: {open_parens} opening braces vs {close_parens} closing braces in $f')
    exit(1)
print(f'OK: $f')
" || exit 1
            fi
          done

      - name: Check asset references
        run: |
          assets=$(find assets -type f | sed 's|^./||')
          for f in templates/*.html docs/*.html; do
            grep -oP '(?:href|src)="([^"]+)"' "$f" | while read -r match; do
              path=$(echo "$match" | sed 's/.*"\(.*\)"/\1/')
              echo "$path" | grep -q '^http' && continue
              echo "$path" | grep -q '^#' && continue
              resolved="$path"
              case "$resolved" in
                ../*) resolved="${resolved#../}";;
                *) continue;;
              esac
              if [ ! -f "$resolved" ] && [ ! -f "${resolved#./}" ]; then
                echo "MISSING: $path referenced in $f"
                exit 1
              fi
            done
          done

      - name: Check template consistency
        run: |
          for f in templates/*.html; do
            grep -q '<!DOCTYPE html>' "$f" || { echo "Missing DOCTYPE in $f"; exit 1; }
            grep -q '<nav>' "$f" || { echo "Missing <nav> in $f"; exit 1; }
            grep -q '<footer>' "$f" || { echo "Missing <footer> in $f"; exit 1; }
          done

      - name: Verify no broken internal links
        run: |
          for f in templates/*.html docs/*.html; do
            grep -oP 'href="([^"]*\.html)"' "$f" | while read -r match; do
              link=$(echo "$match" | sed 's/href="\(.*\)"/\1/')
              case "$link" in
                http*) continue;;
                ../templates/*) resolved="${link#../}";;
                ../docs/*) resolved="${link#../}";;
                *) continue;;
              esac
              [ -f "$resolved" ] || { echo "BROKEN LINK: $link in $f"; exit 1; }
            done
          done
